<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        let car=["ferrari","baleno","suzuki"];
        len=car.length;
        let text=" ";
        for(let i=0;i<len;i++){
            if(i==1)
            continue
            text+=car[i]+"<br>";
        }
        document.getElementById("demo").innerHTML=text;
        //while loop
        let i=1;
        while(i<11){
            document.write("2"+"*"+i+"="+2*i+"<br>");
            i++;
        }
    </script>
</body>
</html>
